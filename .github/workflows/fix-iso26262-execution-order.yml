name: Synchronize ISO 26262 execution order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update execution order
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/automotive-power-supply-test-matrix.md')
          s = p.read_text(encoding='utf-8')
          old = '''7. Endurance: LIFE-001 through LIFE-004 after short-duration validation passes.
          8. Electromagnetic-compatibility pre-compliance: EMC-006 as soon as the layout and harness are representative.
          9. Formal qualification: conducted transients, electromagnetic compatibility, electrostatic discharge, insulation/dielectric, environmental, 48-volt/high-voltage and safety tests with the required compliant equipment.'''.replace('          ','')
          new = '''7. Endurance and robustness margin: LIFE-001 through LIFE-005 after short-duration validation passes; LIFE-005 uses sacrificial samples where destructive margin exploration is permitted.
          8. Functional-safety verification: FUSA-001 through FUSA-011, driven by the technical and hardware safety requirements, safety analyses, allocated fault-tolerant time intervals and assumptions of use.
          9. Electromagnetic-compatibility pre-compliance: EMC-006 as soon as the layout and harness are representative.
          10. Formal qualification: conducted transients, electromagnetic compatibility, electrostatic discharge, insulation/dielectric, environmental, 48-volt/high-voltage and safety tests with the required compliant equipment.'''.replace('          ','')
          if old not in s:
              raise RuntimeError('Expected execution-order block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/fix-iso26262-execution-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize ISO 26262 execution order"
          git push
