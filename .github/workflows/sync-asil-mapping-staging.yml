name: Sync ASIL mapping staging

on:
  push:
    branches:
      - docs/100-row-power-supply-matrix
    paths:
      - .github/workflows/sync-asil-mapping-staging.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/100-row-power-supply-matrix
      - name: Sync wording and clean workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/iso26262-asil-test-mapping.md')
          s = p.read_text()
          old = 'This file maps the 89 tests in [`automotive-power-supply-test-matrix.md`](automotive-power-supply-test-matrix.md), plus 11 proposed additions, to their functional-safety role under ISO 26262.'
          new = 'This file maps the 100 tests in [`automotive-power-supply-test-matrix.md`](automotive-power-supply-test-matrix.md) to their functional-safety role under ISO 26262; the 11 additions introduced by the Revision 2 review are now incorporated in the matrix.'
          assert old in s, 'expected mapping summary text not found'
          s = s.replace(old, new, 1)
          s = s.replace(
              '- **Matrix update needed.** Add FUSA-002 to FUSA-011 and LIFE-005 to the matrix with stimulus, equipment and N6700 mapping; update its four ISO 26262 columns and its ISO 26262 applicability section to the §3 legend.',
              '- **Matrix synchronization complete.** FUSA-002 to FUSA-011 and LIFE-005 are incorporated in the matrix with stimulus, equipment, N6700 mapping and ISO 26262 grading.'
          )
          p.write_text(s)
          PY
          rm -f .github/workflows/sync-asil-mapping-staging.yml
          git config user.name 'github-matrix-bot'
          git config user.email 'github-matrix-bot@users.noreply.github.com'
          git add -A
          git commit -m 'docs: sync ISO 26262 mapping with 100-row matrix'
          git push origin HEAD:docs/100-row-power-supply-matrix
