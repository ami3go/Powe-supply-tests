name: Export validation matrix CSV

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate and validate CSV
        shell: python
        run: |
          from pathlib import Path
          import csv
          import re

          source = Path('docs/automotive-power-supply-test-matrix.md')
          target = Path('docs/automotive-power-supply-test-matrix.csv')
          lines = source.read_text(encoding='utf-8').splitlines()

          def split_markdown_row(line):
              text = line.strip()
              if not (text.startswith('|') and text.endswith('|')):
                  raise ValueError(f'Not a markdown table row: {line}')
              text = text[1:-1]
              cells = []
              current = []
              slash_count = 0
              for ch in text:
                  if ch == '|' and slash_count % 2 == 0:
                      cells.append(''.join(current).strip())
                      current = []
                      slash_count = 0
                      continue
                  current.append(ch)
                  if ch == '\\':
                      slash_count += 1
                  else:
                      slash_count = 0
              cells.append(''.join(current).strip())
              return [re.sub(r'\\([\\|*_`])', r'\1', cell) for cell in cells]

          start = next(i for i, line in enumerate(lines) if line.startswith('| ID | Category | Test |'))
          header = split_markdown_row(lines[start])
          rows = []
          for line in lines[start + 2:]:
              if not line.startswith('|'):
                  break
              row = split_markdown_row(line)
              if row and row[0] != 'ID':
                  rows.append(row)

          if len(header) != 15:
              raise RuntimeError(f'Expected 15 columns, got {len(header)}: {header}')
          if len(rows) != 100:
              raise RuntimeError(f'Expected 100 test rows, got {len(rows)}')
          if len({r[0] for r in rows}) != 100:
              raise RuntimeError('Test IDs are not unique')
          bad = [(r[0] if r else '?', len(r)) for r in rows if len(r) != 15]
          if bad:
              raise RuntimeError(f'Rows with incorrect column count: {bad}')

          with target.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.writer(f, quoting=csv.QUOTE_MINIMAL)
              writer.writerow(header)
              writer.writerows(rows)

          print(f'Wrote {target}: {len(rows)} rows x {len(header)} columns')

      - name: Remove one-shot workflow and commit CSV
        run: |
          rm -f .github/workflows/export-matrix-csv.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automotive-power-supply-test-matrix.csv .github/workflows/export-matrix-csv.yml
          git commit -m "docs: add CSV copy of validation matrix"
          git push
