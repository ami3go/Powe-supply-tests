name: Apply charging matrix expansion

on:
  push:
    paths:
      - '.github/workflows/apply-charging-matrix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CHG rows
        run: python3 scripts/apply_charging_matrix.py
      - name: Validate matrix consistency
        run: python3 check_matrix_consistency.py
      - name: Commit generated matrix updates
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Test-matrix docs/automated-power-supply-validation-bench.md reference/research-source-links-v2.md
          git commit -m 'feat: add OBC and V2G tests to automotive matrix'
          git push origin HEAD:main
