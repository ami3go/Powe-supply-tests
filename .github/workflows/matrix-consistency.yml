name: Matrix consistency

on:
  push:
    paths:
      - 'docs/**'
      - 'check_matrix_consistency.py'
      - '.github/workflows/matrix-consistency.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'check_matrix_consistency.py'
      - '.github/workflows/matrix-consistency.yml'

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate matrix artefacts
        run: python3 check_matrix_consistency.py
