name: Cleanup Claude review

on:
  push:
    branches:
      - cleanup/claude-review-2026-09-21
    paths:
      - '.github/workflows/cleanup-claude-review-2026-09-21.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/claude-review-2026-09-21
      - name: Correct review-package self-consistency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/research-source-links-v2.md')
          s = p.read_text()
          assert 'adds **entries 44–88**' in s
          s = s.replace('adds **entries 44–88**', 'adds **entries 44–91**', 1)
          assert 'Grades 0–3 by ambient (Grade 0 −40…+150 °C through Grade 4 0…+70 °C)' in s
          s = s.replace(
              'Grades 0–3 by ambient (Grade 0 −40…+150 °C through Grade 4 0…+70 °C)',
              'Grades 0–4 by ambient (Grade 0 −40…+150 °C through Grade 4 0…+70 °C)',
              1,
          )
          p.write_text(s)

          q = Path('check_matrix_consistency.py')
          t = q.read_text()
          assert 'w = csv.writer(f)' in t
          q.write_text(t.replace('w = csv.writer(f)', 'w = csv.writer(f, lineterminator="\\n")', 1))
          PY
          python3 check_matrix_consistency.py
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-review-bot'
          git config user.email 'github-review-bot@users.noreply.github.com'
          git add docs/research-source-links-v2.md check_matrix_consistency.py
          git commit -m 'docs: fix Claude review source metadata and CSV regeneration'
          git push origin HEAD:cleanup/claude-review-2026-09-21
