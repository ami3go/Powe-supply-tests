name: Fix ISO 26262 class summary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct class totals and validate source
        shell: python
        run: |
          from pathlib import Path
          import csv
          p = Path('docs/iso26262-asil-test-mapping.md')
          s = p.read_text(encoding='utf-8')
          old = '''| CORE | 25 |
          | CORE* | 14 |
          | TRIG | 12 |
          | ROB | 38 |
          | QUAL | 7 |
          | SUPP | 2 |
          | **Total** | **100** |'''.replace('          ','')
          new = '''| CORE | 25 |
          | CORE* | 14 |
          | TRIG | 12 |
          | TRIG* | 2 |
          | ROB | 38 |
          | QUAL | 7 |
          | SUPP | 2 |
          | **Total** | **100** |'''.replace('          ','')
          if old not in s:
              raise RuntimeError('Expected class-summary block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          rows = list(csv.DictReader(Path('docs/iso26262-test-classification.csv').open(encoding='utf-8')))
          if len(rows) != 100 or len({r['test_id'] for r in rows}) != 100:
              raise RuntimeError('Classification CSV is not 100 unique rows')
          if sum(r['class'] in {'TRIG*', 'TRIG\\*'} for r in rows) != 2:
              raise RuntimeError('Expected exactly two TRIG* rows')
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/fix-iso26262-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: correct ISO 26262 class summary"
          git push
