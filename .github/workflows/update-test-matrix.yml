name: Update automotive power supply matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-test-matrix.yml'

permissions:
  contents: write

jobs:
  update-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate reviewed matrix
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          payload = ''.join(
              Path(f'.github/tmp/matrix.part{i}').read_text().strip()
              for i in range(4)
          )
          data = gzip.decompress(base64.b64decode(payload))
          expected = 'c97c0eaefcbb1928f2c1a870f00d01be6fa7505aa25030d12d2c5ba1f8fbbaab'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise RuntimeError(f'Matrix SHA-256 mismatch: {actual}')
          Path('docs').mkdir(parents=True, exist_ok=True)
          Path('docs/automotive-power-supply-test-matrix.md').write_bytes(data)
      - name: Commit matrix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automotive-power-supply-test-matrix.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: merge matrix review and N6700 mapping"
            git push
          fi
