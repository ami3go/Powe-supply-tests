name: Update automotive power supply matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-test-matrix.yml'

permissions:
  contents: write

jobs:
  update-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate reviewed matrix
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          names = [
              'matrix.part0a',
              'matrix.part0b1',
              'matrix.part0b2a', 'matrix.part0b2b', 'matrix.part0b2c', 'matrix.part0b2d', 'matrix.part0b2e',
              'matrix.part1', 'matrix.part2', 'matrix.part3',
          ]
          payload = ''.join((Path('.github/tmp') / name).read_text().strip() for name in names)
          if len(payload) != 25372:
              raise RuntimeError(f'Unexpected encoded payload length: {len(payload)}')
          data = gzip.decompress(base64.b64decode(payload))
          expected = 'c97c0eaefcbb1928f2c1a870f00d01be6fa7505aa25030d12d2c5ba1f8fbbaab'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise RuntimeError(f'Matrix SHA-256 mismatch: {actual}')
          Path('docs').mkdir(parents=True, exist_ok=True)
          Path('docs/automotive-power-supply-test-matrix.md').write_bytes(data)
      - name: Commit matrix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automotive-power-supply-test-matrix.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: merge matrix review and N6700 mapping"
            git push
          fi
