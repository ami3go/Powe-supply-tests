name: Normalize automotive test matrix status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-test-matrix.yml'

permissions:
  contents: write

jobs:
  normalize-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct setup status labels
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/automotive-power-supply-test-matrix.md')
          lines = path.read_text().splitlines()
          partial_ids = {'PS-006', 'PS-012', 'PS-015', 'PS-019', 'PS-029', 'LIFE-004'}
          changed = []
          for index, line in enumerate(lines):
              for test_id in partial_ids:
                  if line.startswith(f'| {test_id} |'):
                      if '| Available |' not in line:
                          raise RuntimeError(f'{test_id} did not have expected Available status')
                      lines[index] = line.replace('| Available |', '| Partial |', 1)
                      changed.append(test_id)
                      break
          if set(changed) != partial_ids:
              raise RuntimeError(f'Missing rows: {sorted(partial_ids - set(changed))}')
          path.write_text('\n'.join(lines) + '\n')
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automotive-power-supply-test-matrix.md
          git commit -m "docs: correct N6700 setup availability labels"
          git push
