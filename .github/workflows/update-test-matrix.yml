name: Update automotive power supply matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-test-matrix.yml'

permissions:
  contents: write

jobs:
  update-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate reviewed matrix
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path
          payload = (
          ""
          ""
          ""
          ""
          ""
          ""
          ""
          ""
          ""
          "[... ELLIPSIZATION ...]"
          ""
          ""
          ""
          ""
          ""
          ""
          ""
          ""
          ""
          )
          Path("docs").mkdir(parents=True, exist_ok=True)
          Path("docs/automotive-power-supply-test-matrix.md").write_bytes(gzip.decompress(base64.b64decode(payload)))
      - name: Commit matrix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automotive-power-supply-test-matrix.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: merge matrix review and N6700 mapping"
            git push
          fi
