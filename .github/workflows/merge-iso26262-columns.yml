name: Merge ISO 26262 ASIL columns

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-matrix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add ISO 26262 ASIL columns to matrix
        shell: python
        run: |
          from pathlib import Path

          matrix_path = Path('docs/automotive-power-supply-test-matrix.md')
          mapping_path = Path('docs/iso26262-asil-test-mapping.md')

          matrix = matrix_path.read_text(encoding='utf-8')
          mapping = mapping_path.read_text(encoding='utf-8')

          statuses = {}
          for line in mapping.splitlines():
              if not line.startswith('| '):
                  continue
              cells = [c.strip() for c in line.strip().strip('|').split('|')]
              if len(cells) != 6:
                  continue
              test_id = cells[0]
              if test_id in {'Test ID', '---'}:
                  continue
              statuses[test_id] = cells[2:6]

          if len(statuses) != 89:
              raise RuntimeError(f'Expected 89 mapped tests, found {len(statuses)}')

          legend = '''### ISO 26262 ASIL applicability\n\nThe four ISO 26262 columns map each bench test to functional-safety applicability. **Mandatory\*** means the test is mandatory when it verifies an allocated safety requirement, fault reaction, safe-state behavior or safety mechanism. **Conditional\*** means it becomes mandatory when the item-specific safety analysis, technical safety concept, hardware safety requirements, dependent-failure analysis or operating environment makes that stress/failure mode safety-relevant. **Not ASIL-specific** means ISO 26262 does not mandate that test solely because of ASIL, although another automotive standard or customer requirement may mandate it.\n\nThe values are intentionally often identical across ASIL A through ASIL D: ISO 26262 scales verification rigor, coverage, independence and evidence with ASIL rather than defining four progressively larger fixed electrical bench-test lists. See [`iso26262-asil-test-mapping.md`](iso26262-asil-test-mapping.md) for the full rationale.\n\n'''

          if '### ISO 26262 ASIL applicability' not in matrix:
              matrix = matrix.replace('## Test matrix\n', legend + '## Test matrix\n', 1)

          out = []
          in_table = False
          header_done = False
          for line in matrix.splitlines():
              if line.startswith('| ID | Category | Test |'):
                  cells = [c.strip() for c in line.strip().strip('|').split('|')]
                  if any('ISO 26262 — ASIL A' == c for c in cells):
                      out.append(line)
                      in_table = True
                      header_done = True
                      continue
                  # Insert before Main reference.
                  cells = cells[:-1] + [
                      'ISO 26262 — ASIL A',
                      'ISO 26262 — ASIL B',
                      'ISO 26262 — ASIL C',
                      'ISO 26262 — ASIL D',
                      cells[-1],
                  ]
                  out.append('| ' + ' | '.join(cells) + ' |')
                  in_table = True
                  header_done = True
                  continue

              if in_table and header_done and line.startswith('|---'):
                  cells = [c.strip() for c in line.strip().strip('|').split('|')]
                  if len(cells) == 11:
                      cells = cells[:-1] + ['---', '---', '---', '---', cells[-1]]
                  out.append('|' + '|'.join(cells) + '|')
                  continue

              if in_table and line.startswith('| '):
                  cells = [c.strip() for c in line.strip().strip('|').split('|')]
                  if cells and cells[0] in statuses:
                      # Existing table has 11 columns; mapped table has 15.
                      if len(cells) == 11:
                          cells = cells[:-1] + statuses[cells[0]] + [cells[-1]]
                      elif len(cells) != 15:
                          raise RuntimeError(f'Unexpected column count {len(cells)} for {cells[0]}')
                      out.append('| ' + ' | '.join(cells) + ' |')
                      continue

              if in_table and line and not line.startswith('|'):
                  in_table = False
              out.append(line)

          updated = '\n'.join(out) + ('\n' if matrix.endswith('\n') else '')

          mapped_rows = sum(1 for line in updated.splitlines() if line.startswith('| ') and line.split('|')[1].strip() in statuses)
          if mapped_rows != 89:
              raise RuntimeError(f'Expected 89 updated matrix rows, found {mapped_rows}')

          matrix_path.write_text(updated, encoding='utf-8')

      - name: Commit matrix update
        run: |
          if git diff --quiet; then
            echo "No matrix changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automotive-power-supply-test-matrix.md
          git commit -m "docs: add ISO 26262 ASIL columns to test matrix"
          git push
