name: Apply global article-derived matrix gaps

on:
  push:
    paths:
      - '.github/workflows/apply-global-article-gaps.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply global matrix update
        run: python3 scripts/apply_global_article_function_gaps.py
      - name: Validate expected rows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Test-matrix/global-power-supply-test-matrix.md')
          s=p.read_text(encoding='utf-8')
          ids=['GEN-021','GEN-022','GEN-023','GEN-024','GEN-025','GEN-026','REL-001']
          assert all(s.count(f'| {x} |') == 1 for x in ids)
          assert 'article-derived function review integrated' in s
          assert 'power-supply-test-functions-from-articles-2026-09-22.md' in s
          print('validated 7 new global rows and provenance link')
          PY
      - name: Commit generated update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Test-matrix/global-power-supply-test-matrix.md
          git commit -m 'feat: add article-derived global power test functions'
          git push
