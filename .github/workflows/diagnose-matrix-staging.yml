name: Diagnose matrix staging

on:
  push:
    branches:
      - docs/100-row-power-supply-matrix
    paths:
      - .github/workflows/diagnose-matrix-staging.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/100-row-power-supply-matrix
      - name: Check staged segments
        shell: bash
        run: |
          {
            echo 'SEGMENTS'
            sha256sum \
              .matrix-upload/part-00a.b64 \
              .matrix-upload/part-00b.b64 \
              .matrix-upload/part-01.b64 \
              .matrix-upload/part-02.b64 \
              .matrix-upload/part-03.b64 \
              .matrix-upload/part-04.b64 \
              .matrix-upload/part-05.b64 \
              .matrix-upload/part-06a.b64 \
              .matrix-upload/part-06b.b64 \
              .matrix-upload/part-07.b64
            echo 'SIZES'
            wc -c \
              .matrix-upload/part-00a.b64 \
              .matrix-upload/part-00b.b64 \
              .matrix-upload/part-01.b64 \
              .matrix-upload/part-02.b64 \
              .matrix-upload/part-03.b64 \
              .matrix-upload/part-04.b64 \
              .matrix-upload/part-05.b64 \
              .matrix-upload/part-06a.b64 \
              .matrix-upload/part-06b.b64 \
              .matrix-upload/part-07.b64
            cat \
              .matrix-upload/part-00a.b64 \
              .matrix-upload/part-00b.b64 \
              .matrix-upload/part-01.b64 \
              .matrix-upload/part-02.b64 \
              .matrix-upload/part-03.b64 \
              .matrix-upload/part-04.b64 \
              .matrix-upload/part-05.b64 \
              .matrix-upload/part-06a.b64 \
              .matrix-upload/part-06b.b64 \
              .matrix-upload/part-07.b64 > /tmp/matrix.b64
            echo 'COMBINED_BASE64'
            sha256sum /tmp/matrix.b64
            wc -c /tmp/matrix.b64
            base64 --decode /tmp/matrix.b64 > /tmp/matrix.md
            echo 'DECODED'
            sha256sum /tmp/matrix.md
            wc -c /tmp/matrix.md
          } > .matrix-upload/diagnostics.txt
          git config user.name 'github-matrix-bot'
          git config user.email 'github-matrix-bot@users.noreply.github.com'
          git add .matrix-upload/diagnostics.txt
          git commit -m 'chore: record matrix staging diagnostics'
          git push origin HEAD:docs/100-row-power-supply-matrix
