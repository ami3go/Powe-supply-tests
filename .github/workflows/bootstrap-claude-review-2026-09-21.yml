name: Bootstrap Claude review

on:
  push:
    branches:
      - review/claude-2026-09-21
    paths:
      - '.github/workflows/bootstrap-claude-review-2026-09-21.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/claude-2026-09-21
      - name: Rebuild and apply
        shell: bash
        run: |
          cat .review-staging/part00.gz.b64 .review-staging/part01.gz.b64 .review-staging/part02.gz.b64 .review-staging/part03.gz.b64 .review-staging/part04.gz.b64 .review-staging/part05.gz.b64 .review-staging/part06.gz.b64 .review-staging/part07.gz.b64 | base64 --decode | gzip -d > /tmp/apply-review.yml
          python3 - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path
          text = Path('/tmp/apply-review.yml').read_text()
          m = re.search(r"payloads = json\.loads\(r'''(.*?)'''\)", text, re.S)
          assert m
          for name, data in json.loads(m.group(1)).items():
              p=Path(name); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          mkdir -p .tmp
          cp /tmp/apply_review.py .tmp/apply_review.py
          python3 .tmp/apply_review.py
          rm -rf .tmp
          mkdir -p .github/workflows
          cat > .github/workflows/matrix-consistency.yml <<'YAML'
          name: Matrix consistency
          on:
            push:
              paths: ['docs/**', 'check_matrix_consistency.py', '.github/workflows/matrix-consistency.yml']
            pull_request:
              paths: ['docs/**', 'check_matrix_consistency.py', '.github/workflows/matrix-consistency.yml']
          jobs:
            consistency:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: python3 check_matrix_consistency.py
          YAML
      - name: Capture validation diagnostic
        shell: bash
        run: |
          set +e
          {
            echo '=== checker ==='
            python3 check_matrix_consistency.py
            echo "checker_rc=$?"
            echo '=== assertions ==='
            python3 - <<'PY'
          from pathlib import Path
          import re
          md=Path('docs/automotive-power-supply-test-matrix.md').read_text()
          ids=re.findall(r'^\|\s*([A-Z0-9]+-\d{3})\s*\|', md, re.M)
          print('ids',len(ids),'unique',len(set(ids)))
          bench=Path('docs/automated-power-supply-validation-bench.md').read_text()
          print('bench_121_phrase', '121 test rows' in bench)
          print('bench_total_row', '**121** | **38** | **23** | **29** | **31**' in bench)
          readme=Path('README.md').read_text()
          print('readme_v2', 'Research Source Links v2' in readme)
          print('mission_profile', Path('docs/mission-profile-template.md').exists())
          PY
            echo "assert_rc=$?"
            echo '=== diff check ==='
            git diff --check
            echo "diff_rc=$?"
          } > .review-staging/validation-diagnostic.txt 2>&1
          git config user.name 'github-review-bot'
          git config user.email 'github-review-bot@users.noreply.github.com'
          git add .review-staging/validation-diagnostic.txt
          git commit -m 'chore: record integrated validation diagnostic'
          git push origin HEAD:review/claude-2026-09-21
          exit 1
