name: Merge Claude ISO 26262 revision

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge corrected mapping and synchronize matrix
        shell: python
        run: |
          from pathlib import Path
          import csv, re

          root = Path('.tmp/iso26262')
          parts = [root / f'part{i:02d}.md' for i in range(4)]
          mapping = ''.join(p.read_text(encoding='utf-8') for p in parts)
          mapping = mapping.replace(
              '- **Matrix visibility:** during the review the matrix was readable only up to TH-001. Rows TH-002 to FUSA-001 were classified from their titles and previous classification; confirm them against their full descriptions.',
              '- **Matrix visibility:** Claude’s initial review had partial visibility after TH-001. Before this merge, rows TH-002 through FUSA-001 were checked against the complete current matrix and the four review corrections in §2.2 were applied.'
          )
          mapping = mapping.replace(
              '- **Single source of truth.** Keep one data file (CSV or YAML) with ID, title, class, evidence method and the QM and A–D cells, and generate both this table and the ISO 26262 columns of the matrix from it (CHG-20).',
              '- **Single source of truth.** [`iso26262-test-classification.csv`](iso26262-test-classification.csv) is the machine-readable classification source with ID, title, class, evidence method, QM relevance and A–D cells. Keep it synchronized with this rationale document and the master matrix (CHG-20).'
          )

          map_rows, csv_rows = {}, []
          in_map = False
          for line in mapping.splitlines():
              if line.startswith('| ID | Test | Was | Class | Evidence | QM | A | B | C | D | Change · note |'):
                  in_map = True; continue
              if in_map and line.startswith('|---'): continue
              if in_map and line.startswith('| '):
                  cells = [c.strip() for c in line.strip().strip('|').split('|')]
                  if len(cells) != 11: raise RuntimeError(f'Bad mapping row: {line}')
                  map_rows[cells[0]] = cells; csv_rows.append(cells); continue
              if in_map and line and not line.startswith('|'): break
          if len(map_rows) != 100: raise RuntimeError(f'Expected 100 mappings, got {len(map_rows)}')

          Path('docs/iso26262-asil-test-mapping.md').write_text(mapping, encoding='utf-8')
          with Path('docs/iso26262-test-classification.csv').open('w', encoding='utf-8', newline='') as f:
              w = csv.writer(f)
              w.writerow(['test_id','test','previous_class','class','evidence','qm','asil_a','asil_b','asil_c','asil_d','note'])
              w.writerows(csv_rows)
          status = {k:v[6:10] for k,v in map_rows.items()}

          new = {}
          with (root/'new_rows.tsv').open(encoding='utf-8', newline='') as f:
              for row in csv.reader(f, delimiter='\t'):
                  if len(row) != 11: raise RuntimeError(f'Bad new-row field count {len(row)} for {row[:2]}')
                  new[row[0]] = row
          if len(new) != 11: raise RuntimeError(f'Expected 11 new rows, got {len(new)}')

          matrix_path = Path('docs/automotive-power-supply-test-matrix.md')
          matrix = matrix_path.read_text(encoding='utf-8')
          legend = '''### ISO 26262 ASIL applicability

The ISO 26262 columns are synchronized with [`iso26262-asil-test-mapping.md`](iso26262-asil-test-mapping.md) and [`iso26262-test-classification.csv`](iso26262-test-classification.csv). The matrix now contains **100 test rows**.

- **REQ** — required when the row verifies the applicable safety requirement or safety mechanism.
- **T** — analysis-triggered; once the safety analysis or architecture makes the failure mode safety-relevant, treat the test as required.
- **++ / + / o** — ISO 26262-5 clause-10 method grades: highly recommended / recommended / no recommendation for or against.
- **FI+ / FI++ / WC+** — fault-injection or worst-case-testing evidence with its method grade.
- **Trailing `*`** — applies only under the row-specific condition or when the operating environment, interface, mission profile or vehicle requirement makes the stress applicable.
- **—** — not driven by ISO 26262; another automotive standard, customer requirement or design-validation plan can still require it.

ISO 26262 does not define a fixed electrical bench-test list per ASIL. Applicability comes from the safety goals, technical and hardware safety requirements, safety mechanisms, safety analyses and assumptions of use. For CORE and applicable ROB rows used as safety evidence, also apply the safety-oriented pass criteria in the detailed mapping: no undetected unsafe excursion, timely fault reaction within the allocated fault-tolerant time interval, defined reset/safe-state behavior, no latent damage to safety mechanisms and safety-relevant monitoring during stress.

'''
          matrix = re.sub(r'### ISO 26262 ASIL applicability\n.*?(?=## Test matrix\n)', legend, matrix, flags=re.S)

          lines, out, in_table = matrix.splitlines(), [], False
          ids = set()
          for line in lines:
              if line.startswith('| ID | Category | Test |'):
                  in_table = True; out.append(line); continue
              if in_table and line.startswith('|---'):
                  out.append(line); continue
              if in_table and line.startswith('| '):
                  cells = [c.strip() for c in line.strip().strip('|').split('|')]
                  tid = cells[0] if cells else ''
                  if tid in map_rows:
                      if len(cells) == 15: cells[10:14] = status[tid]
                      elif len(cells) == 11: cells = cells[:10] + status[tid] + [cells[-1]]
                      else: raise RuntimeError(f'{tid}: unexpected {len(cells)} columns')
                      if tid == 'PS-013':
                          cells[6] = 'No latch-up or uncontrolled repeated stress; restart behavior matches the technical safety concept (latched, counter-limited retry or automatic retry)'
                      if tid == 'TH-004':
                          cells[6] = 'Controlled protection; no destructive cycling; restart/recovery behavior matches the technical safety concept and cannot exit a required latched safe state'
                      out.append('| ' + ' | '.join(cells) + ' |'); ids.add(tid)
                      if tid == 'LIFE-004' and 'LIFE-005' not in ids:
                          d = new['LIFE-005']; out.append('| ' + ' | '.join(d[:10]+status['LIFE-005']+[d[10]]) + ' |'); ids.add('LIFE-005')
                      if tid == 'FUSA-001' and 'FUSA-002' not in ids:
                          for nid in [f'FUSA-{i:03d}' for i in range(2,12)]:
                              d=new[nid]; out.append('| ' + ' | '.join(d[:10]+status[nid]+[d[10]]) + ' |'); ids.add(nid)
                      continue
              if in_table and line and not line.startswith('|'): in_table = False
              out.append(line)

          updated = '\n'.join(out) + ('\n' if matrix.endswith('\n') else '')
          final_ids=[]
          for line in updated.splitlines():
              if line.startswith('| '):
                  c=[x.strip() for x in line.strip().strip('|').split('|')]
                  if c and c[0] in map_rows:
                      if len(c)!=15: raise RuntimeError(f'{c[0]} final columns={len(c)}')
                      final_ids.append(c[0])
          if len(final_ids)!=100 or len(set(final_ids))!=100:
              raise RuntimeError(f'Final matrix has {len(final_ids)} rows / {len(set(final_ids))} unique')
          missing=sorted(set(map_rows)-set(final_ids))
          if missing: raise RuntimeError(f'Missing rows: {missing}')
          matrix_path.write_text(updated, encoding='utf-8')

      - name: Remove one-shot staging files and workflow
        run: |
          rm -rf .tmp/iso26262
          rm -f .github/workflows/merge-claude-iso26262.yml

      - name: Commit synchronized ISO 26262 revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: merge reviewed ISO 26262 Revision 2"
          git push
